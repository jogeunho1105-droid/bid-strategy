name: Apply v2.15.8 summary table update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v2.15.8.yml"
      - ".github/scripts/apply_v2_15_8.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply approved v2.15.8 change
        run: python .github/scripts/apply_v2_15_8.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and regression tests
        run: |
          python -m py_compile "입찰 앱.py" bid_rules.py bid_engine.py bid_legacy.py
          PYTHONPATH=.:analysis python -m unittest discover -s tests -p "test*.py"
          git diff --check

      - name: Streamlit smoke test
        run: |
          streamlit run "입찰 앱.py" --server.headless true --server.port 8501 >/tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/ >/tmp/streamlit-home.html; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/ >/dev/null
          grep -q "Streamlit" /tmp/streamlit-home.html

      - name: Commit verified release
        run: |
          rm -f .github/workflows/apply-v2.15.8.yml
          rm -f .github/scripts/apply_v2_15_8.py
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.15.8 summary table layout"
          git push origin HEAD:main
